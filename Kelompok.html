<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelompok</title>
    <link rel="stylesheet" href="Styles/Style-Kelompok.css">
</head>
<body>

    <div class="container">
    <h2>Randomizer Kelompok</h2>
    <label>Masukkan nama (1 nama per baris):</label>
    <div class="textarea">
        <textarea id="namaInput" rows="10"></textarea>
    </div>
    
    <label>Maksimal kelompok:</label>
    <input type="number" id="maxKelompok" min="1">

    <button class="other-btn" onclick="buatKelompok()">Buat Kelompok</button>
    <button class="other-btn" onclick="goToOtherScriptIndex()">Halaman Utama</button>

    <div class="hasil" id="hasil"></div>


    <script src="Script/Script-kelompok.js"></script>
</body>
</html>
